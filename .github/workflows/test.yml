name: Validate Skill and deterministic engines
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[documents,dev]"
      - run: python -m pytest
      - run: python -m ruff check scripts tests
      - run: python scripts/check_skill.py
      - run: python scripts/package_skill.py --output skill-dist
