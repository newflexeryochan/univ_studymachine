[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "univ-studymachine"
version = "0.1.0"
description = "Evidence-grounded, past-exam-first university preparation Agent Skill"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "tzdata>=2025.1"]

[project.optional-dependencies]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2", "python-pptx>=1,<2", "openpyxl>=3.1,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
univ-studymachine = "studymachine.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
